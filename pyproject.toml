[project]
name = "sonart-insight"
version = "0.1.0"
description = "ERP raporlarindan yonetim dashboard'u ve AI destekli donemsel analiz ureten servis"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "live: gercek Claude API cagrisi yapar (varsayilan olarak calistirilmaz)",
]

# ---------------------------------------------------------------------------
# ruff  (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() varsayilan argumanda kullanilir -- kasitli
    "RUF001",  # Turkce karakterler "belirsiz" sayiliyor; proje bilerek Turkce
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["polars.*", "reportlab.*"]
ignore_missing_imports = true
